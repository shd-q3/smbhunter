[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smbhunter"
version = "0.4.0"
description = "Smart SMB share enumerator — tiered severity, date-aware recursion, content search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "shd" }]
keywords = ["smb", "enumeration", "pentesting", "share", "spider", "redteam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "impacket>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/shd-q3/smbhunter"
Repository = "https://github.com/shd-q3/smbhunter"
Issues = "https://github.com/shd-q3/smbhunter/issues"

[project.scripts]
smbhunter = "smbhunter.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
