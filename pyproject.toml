[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smbhunter"
version = "0.2.0"
description = "Smart SMB share enumerator — tiered severity, date-aware recursion, content search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "shd" }]
dependencies = [
    "impacket>=0.12.0",
]

[project.scripts]
smbhunter = "smbhunter.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
